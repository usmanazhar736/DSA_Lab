<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ project.title if project else 'Project Not Found' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="navbar navbar-dark bg-transparent position-sticky top-0 py-3">
    <div class="container">
      <a href="{{ url_for('index') }}" class="navbar-brand">← Back</a>
    </div>
  </nav>
  <main class="container section-padding">
    {% if not project %}
      <div class="text-center py-5">
        <h1 class="display-6">Project Not Found</h1>
        <p class="text-muted">The project you are looking for does not exist.</p>
      </div>
    {% else %}
      <div class="row align-items-start g-4">
        <div class="col-12 col-lg-6">
          <img src="{{ url_for('static', filename=project.image) }}" class="img-fluid rounded shadow" alt="{{ project.title }}" />
        </div>
        <div class="col-12 col-lg-6">
          <h1 class="h2 mb-3">{{ project.title }}</h1>
          <div class="d-flex flex-wrap gap-2 mb-3">
            {% for tag in project.tags %}
              <span class="badge bg-secondary-subtle text-secondary-emphasis">{{ tag }}</span>
            {% endfor %}
          </div>
          <p class="text-muted">{{ project.details }}</p>
          <a href="/" class="btn btn-primary">Back to Home</a>
        </div>
      </div>
    {% endif %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
